# For projects, all values in `facility.ini` are also valid, and apply to that base.
#   Any field starting with "global_" does the same thing as the rest of the command does in `facility.ini`, but for all bases.
#   Additionally, the following fields are valid for projects only:
# project_time_warp_enabled = boolean; PROJECT_TIME_WARP_ENABLED Enables project for random selection in time warp starts.
# terraform_rate = integer, (string, ...); TERRAFORM_RATE Value is increase of terraform rate. Will be multiplied by 10, must be 1-31 (before multiplication).
#     Strings is optional list of former operations to which it applies. If empty, applies to all. Valid values are listed below under terraform_unlock:
# terraform_unlock = string; TERRAFORM_UNLOCK Unlock the terraform operation early. Comma-seperated list, which when pre-pended with FORMER_ must be in engine_veh.h/FormerItem
# council_votes_increase = integer, integer; value1/value2 multiplier of council votes.
# counts_as_infiltration = boolean; COUNTS_AS_INFILTRATION Whether the project counts as infiltrating all other factions.
# fungus_repair_as_native = boolean; FUNGUS_REPAIR_AS_NATIVE All player units repair as fast as natives when in fungus.
# fungus_move_as_native = boolean; FUNGUS_MOVE_AS_NATIVE All player units treat fungus as roads (like natives).
# fungus_combat_as_native = boolean; FUNGUS_COMBAT_AS_NATIVE Player units get fungus combat bonuses like natives. Extra defense bonus, and attack bonus that overrides normal faction v faction defense bonus.
# psi_defense = integer; PSI_DEFENSE % bonus applied to all units when defending in psi combat.
# psi_attack = integer; PSI_ATTACK % bonus applied to all units when attacking in psi combat.
# land_speed = integer; UNIT_SPEED Increase in moves for land units
# sea_speed = integer; UNIT_SPEED Increase in moves for sea units
# air_speed = integer; UNIT_SPEED Increase in moves for air units
# tech_share = integer; TECH_SHARE Get free tech if owned by (value) others.
# se_economy = integer; SE_FACTION Added to Social Engineering.
# se_efficiency = integer; SE_FACTION Added to Social Engineering.
# se_support = integer; SE_FACTION Added to Social Engineering.
# se_morale = integer; SE_FACTION Added to Social Engineering.
# se_police = integer; SE_FACTION Added to Social Engineering.
# se_growth = integer; SE_FACTION Added to Social Engineering.
# se_planet = integer; SE_FACTION Added to Social Engineering.
# se_probe = integer; SE_FACTION Added to Social Engineering.
# se_industry = integer; SE_FACTION Added to Social Engineering.
# se_research = integer; SE_FACTION Added to Social Engineering.
# probe_immunity = integer; PROBE_IMMUNITY 1=vanilla, 2=absolute. Vanilla allows other factions to bypass immunity with Algorithmic Enhancement unit ability.
# repair_speed = int; REPAIR_SPEED HP/turn, Nano Factory default: 2
# lift_repair_limit = bool; LIFT_REPAIR_LIMIT Normally units can't repair over 80% health in the field - with this they can.
# unit_upgrade_cost_mult = int, int; UNIT_UPGRADE_COST_MULT Numerator/divisor to modify cost with.
# impunity = string (, string...); IMPUNITY Get impunity for the provided SE model(s). All negative effects are removed.
# pop_floor = integer; POP_FLOOR Enforced on project completion and new bases.
# drones_under_pop_floor = integer; DRONES_UNDER_POP_FLOOR Drone modifier when at or below pop_floor.
# orbital_insertion = boolean; ORBITAL_INSERTION Unlock Orbital Insertions.
# transcendence_victory = boolean; TRANSCENDENCE_VICTORY project gives transcendence victory
# mind_control_mult = int, int; MIND_CONTROL_MULTIPLIER Num/Div of mind control that the owning faction is doing.
# all_probes_have_algo_enhance = boolean; ALL_PROBES_ALGORITHMIC_ENHANCEMENT All probes act as if they have the Algorithmic Enhancement ability.
# active_probes_morale = int; ACTIVE_PROBE_MORALE Increase morale of active probes.
# longevity_vaccine_effects = boolean; LONGEVITY_VACCINE_EFFECTS I'm not doing all that.
# voice_of_planet_effects = boolean; VOICE_OF_PLANET_EFFECTS Stops fungus pops, interludes, globally doubles hurry price, and sets the climactic flag.



