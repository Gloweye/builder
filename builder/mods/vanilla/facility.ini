# Facility declaration file. Configures the effects of facilities.

# syntax: (type) is optional values, type are required values.

# MILITARY PROPERTIES
# garrison_morale_mod = int, (str), (str); MORALE_MOD Added to morale of garrisoned units. Clamped between -6 and 6. Strings filter application of the modifier, with valid being NATIVE, NOT_NATIVE, ATTACKER, and DEFENDER.
# base_morale_floor = int, (str), (str); MORALE_FLOOR Morale of units in this base can never be below this. 0-6 are valid numbers, for Very Green to Elite. Optional strings are same as above. Always processed last.
# garrison_ignore_negative_se_morale: string; GARRISON_IGNORE_NEGATIVE_SE_MORALE Garrisons ignore the consequences of a negative SE morale score. String may be NATIVE, NON_NATIVE, or ALL.
# base_prevent_pop_loss = boolean; PREVENT_POP_LOSS Stops -1 pop on losing defender, stops base_size=1 when attacked by nerve gas.
# base_defense = int, str; DEFENSE Additive % defense bonus against land attackers - overwrites thinker.ini. String is one of triad "LAND", "SEA", or "AIR".
# scorched_earth = boolean; SCORCHED_EARTH Destroy on base capture unless recapture. Ignored if thinker.ini/facility_capture_fix=1 (the default)
# morale = str, int; MORALE Added to morale of extended triad units on production. Native counts as repair.
# probe_plague_resistance = int, int; PROBE_PLAGUE_RESISTANCE Numerator/Divisor of the population loss/unit damage suffered from the Probe Genetic Plague action.
# remote_unit_mind_control_resistance = int, int; HOMED_UNIT_MIND_CONTROL_RESISTANCE Numerator/Divisor of the distance factor when Probe Mind Control targets units homing in this base.
# repair = string; REPAIR Facility counts as repair facility for triad "LAND", "SEA", or "AIR". Repair speed is read from thinker.ini/repair_base_facility (default 2)
# prevent_drop_pod_range = integer; PROTECT_RANGE_DROP_PODS Prevent drop pod units from deploying closer to the base than this. Max is 8.
# is_teleporter = boolean; TELEPORT Facility is a teleporter. Not much to say, since max teleports is handled by base flags.
# cost_mult = str, integer; COST_MULT Cost multiplier in %. String is LAND, SEA, AIR, PROBE, NATIVE and filters. Probe/natives don't count as triad.
# nuke_defense = integer, integer; NUKE_DEFENSE (range, % neutralize chance) when defending against nukes. Will be processed after deploying ODP, but before sacrificing them. Range max is 8.
# missile_defense = integer, integer; MISSILE_DEFENSE (range, X defense modifier) when defending against non-nuke missiles. Range max is 8.
# is_sensor = boolean; SENSOR Provides sensor bonus, same as the terraform.
# mind_control_resistance = integer, integer; MIND_CONTROL_RESISTANCE numerator/divisor of distance_from_hq factor when calculating mind control price.

# BASE MANAGEMENT PROPERTIES
# counts_as = string(, string); COUNTS_AS Load all properties of the referenced facility, even if it's not present. Optional second value, only activate effect when it is another facility.
# submersion = boolean; SUBMERSION if True, base may be submerged.
# population_limit = int; POP_LIMIT Added across facilities to set population limit.
# drones = int; DRONES Added to drone count. Negative numbers reduce drones, positive increase.
# talents = int; TALENTS Added to talent count. Negative numbers reduce talents, positive increase.
# suppress_psych = string; SUPPRESS_PSYCH Comma-seperated list, valid are DRONES and TALENTS. Supplied types are set to 0.
# clean_minerals = integer; CLEAN_MINERALS On being constructed, add this to a player's clean mineral cap for ALL bases.
# terraform_eco_damage_reduction = integer; ECO_DAMAGE_REDUCTION_TERRAFORM % of terraform-induced eco damage is negated. Additive, so can go to 0.
# mineral_eco_damage_reduction = int; ECO_DAMAGE_REDUCTION_MINERAL Added to DamageReductionInBase in formula https://alphacentauri.miraheze.org/wiki/Ecology_(Revised)
# base_se_efficiency = int; SE Added to Social Engineering Efficiency for this base.
# base_se_growth = int; SE Added to Social Engineering Growth for this base.
# base_se_probe = int; SE Added to Social Engineering Probe for this base.
# base_se_police = int; SE Added to Social Engineering Police for this base.
# base_se_economy = int; SE Added to Social Engineering Economy for this base.
# base_se_industry = int; SE Added to Social Engineering Industry for this base.
# base_se_support = int; SE Added to Social Engineering Support for this base.
# base_se_planet = int; SE Added to Social Engineering Planet for this base. (like eco-damage & stuff)
# force_pop_boom = bool; POP_BOOM Always enforce pop boom.
# half_maintenance = boolean; HALF_MAINTENANCE Halves facility maintenance.
# virtual_police = integer; VIRTUAL_POLICE Base counts as having this many additional police present (but without police ability)
# prevent_drone_riot = boolean; PREVENT_DRONE_RIOT May still have drones, but can't riot.

# ECONOMIC PROPERTIES
# base_nme = int, int, int; BASE_SQ_INCOME Added to base square income. Nutrients, Minerals, Energy, in that order. This square always ignores resource limits.
# resource_percent = int, int, int; RESOURCE_PERCENT Increases nutrient/mineral/energy by 1% additive per point.
# forest_nme = int, int, int; FOREST_INCOME Flat nutrients, minerals, energy added to the yields of every forest square.
# improved_ocean_nme = int, int, int: IMPROVED_OCEAN_INCOME Flat nutrients, minerals, energy added to improved ocean squares (kelp/mining platform/tidal harness)
# improved_land_nme = int, int, int: IMPROVED_LAND_INCOME Flat nutrients, minerals, energy added to improved land squares (farm/mine/solar collector)
# fungus_nme = int, int, int; FUNGUS_INCOME Flat nutrients, minerals, energy added to fungus squares.
# square_nme = int, int, int; SQUARE_INCOME Flat nutrients, minerals, energy added to non-fungus squares.
# nme_cap = int, int, int; NME_CAP Increase yield cap for nutrients/minerals/energy.
# base_clp = int, int, int; CLP_INCOME Flat credits/labs/psych income, before multipliers (think Biology Lab labs)
# coeff_clp = int, int, int; CLP_COEFF % bonus to credits/labs/psych, think Network Node/Energy Bank.
# base_final_labs_mult = integer; BASE_FINAL_LABS_MULT like base_clp, but multiplicative with everything.
# full_satellite_value = boolean; FULL_SATELLITE_EFFECT Don't halve satellite income.
# mult_credits = int, int; MULTIPLICATIVE_CREDITS Numerator/divisor of a multiplier for the credits. Fully multiplicative, except for fac_count projects.
# mult_labs = int, int; MULTIPLICATIVE_LABS Numerator/divisor of a multiplier for the labs. Fully multiplicative, except for fac_count projects.
# mult_psych = int, int; MULTIPLICATIVE_PSYCH Numerator/divisor of a multiplier for the psych. Fully multiplicative, except for fac_count projects.
# fac_count = string, string; FACILITY_COUNT Count all facilities in all bases from all players named (value1) and add that much (value2). value2 is one of CREDITS, LABS, PSYCH. Is unaffected by % increases.
# planet_fung_bonus = int, string, integer; PLANET_FUNG_BONUS When SE_PLANET >= (value1), get +(value3) yield of type (value2, NUTRIENT/MINERAL/ENERGY)
# commerce_as_income = str: COMMERCE_TO_INCOME Resource Type (CREDITS, LABS, PSYCH)
# satellite_production_mult = integer, integer: SATELLITE_PROD_MULT Num/Div of multiplier to give to production of satellites.
# stockpile_energy_bonus = int, int; STOCKPILE_ENERGY_BONUS num/div of bonus to stockpile energy.
# efficiency_floor_flat = int; This much energy is immune to inefficiency.
# efficiency_floor_percent = int; This % of energy is immune to inefficiency. Stacks additively (so 100% total means immunity to inefficiency)

# PREREQUISITE PROPERTIES
# incompatible_fac = string; INCOMPATIBLE_FACILITY Require other facility to NOT be built. Multiple entries are AND-ed.
# require_fac = string; REQUIRE_FACILITY Require other facility to be built. Multiple entries are AND-ed.
# preq_count_as = string; PREQ_COUNT_AS Is considered to be the value facility for the purpose of "require_fac"
# require_coast = boolean; REQUIRE_COAST Requires coast access to be built.
# is_smax = boolean; IS_SMAX Facility is disabled when using smac_only=1 in thinker.ini.
# alien_exclusive = boolean; ALIEN_EXCLUSIVE Require to be alien to build.
# require_pop_size = integer; REQUIRE_POP_SIZE Required pop size to build.
# is_satellite = boolean; IS_SATELLITE May be attacked from space, requires a `can_build_satellite` facility to be built.
# require_transcend_victory_possible = boolean; REQUIRE_TRANSCEND_VICTORY_POSSIBLE
# require_project_complete = string; REQUIRE_PROJECT_COMPLETED Project to be completed. Doesn't have to be same player.

# MISC. PROPERTIES.
# is_hq = boolean; IS_HQ special variable. Can only have 1. Automatically built if only 1 base. Affects lots of things.
# base_size_indicator_border_color = int, int; BASE_SIZE_INDICATOR_BORDER_COLOR color_code/width. Visual only. Border color can be any in gui.h. Most colors are untested.
# link_alien_artifact = boolean; LINK_ALIEN_ARTIFACT Lets base link 1 alien artifact. Not cumulative with multiple facilities.
# link_infinite_artifacts = boolean; LINK_INFINITE_ARTIFACTS This base can link infinite alien artifacts.
# retool_max_penalty = int; RETOOL_MAX_PENALTY_CLASS Retool strictness cannot exceed value (minimum between facilities).
# retool_max_penalty values: RETOOL_ALWAYS_FREE = 0, RETOOL_FREE_CATEGORY = 1, RETOOL_FREE_PROJECT = 2, RETOOL_NEVER_FREE = 3,
# prototype_penalty_mult = integer; PROTOTYPE_PENALTY_MULT % prototype penalty discount. 0 = regular unit price. 100 = 150% unit price, 50 = 125%, etc.
# no_capture_destruction = boolean; NO_CAPTURE_DESTRUCTION Facility is excluded from random facility destruction on base capture.
# victory_when_built = integer; ALIEN_VICTORY Player whens when building this many of the facility. Build requirements are double-checked.
# can_build_satellite = boolean; CAN_BUILD_SATELLITE Enables satellite construction for this base
# free_tech = integer; FREE_TECH Get (value) free techs on construction.

# first_base_free_mp = boolean; FIRST_BASE_FREE_MP Free for first base if playing Multiplayer.
# first_base_free_mp_difficulty = integer; FIRST_BASE_FREE_MP_DIFFICULTY If difficulty >= value, give this facility to HQ for free in MP.
# first_base_free_mp_se_positive = string; FIRST_BASE_FREE_MP_SE_POSITIVE String is SE identifier, facility is given for free to first base in MP if there is an inherent bonus.
# first_base_free_turn = int; FIRST_BASE_FREE_TURN Free for first base if current turn count >= value,
# sea_base_free = boolean; SEA_BASE_FREE Free if base is a sea base.
# time_warp_free_hq = boolean; FIRST_BASE_FREE_TIME_WARP Free for HQ when using Time Warp start.

# AI DECISION PROPERTIES
# ai_hurry_econ_eager = boolean; AI_HURRY_ECON_EAGER AI will eagerly hurry building this for economical reasons.
# ai_tech_value_early_eco = boolean; AI_TECH_VALUE_EARLY_ECO AI values the requisite tech higher while trading
# ai_riot_prevention = boolean; AI_RIOT_PREVENTION Ai cannot build when base cannot riot (Matrix/Punishment Sphere/Nerve Staple active)
# defends_base = boolean; DEFENDS_BASE Affects probe sabotage facility targetting.
# nuke_target = boolean; NUKE_TARGET AI likes nuking the base that has this project.

# EVENT PROPERTIES
# Modder Note: Most of these have hardcoded facility names in xscript.txt. The popup function has not been decompiled
# yet. Maybe the PROMETHEUS1 event might help generalizing this...
# handle_growth_event = boolean; HANDLE_EVENT_GROWTH Population surge event (xscript.txt #CRECHE)
# handle_energy_event = boolean; HANDLE_EVENT_GROWTH Energy surge event (xscript.txt #SURGE)
# handle_netbonus_event = boolean; HANDLE_EVENT_NETBONUS Netbonus event (xscript.txt #NETBONUS)
# handle_blight_event = boolean; HANDLE_EVENT_BLIGHT blight event (xscript.txt #BLIGHT)
# handle_prometheus_event = boolean; HANDLE_EVENT_PROMETHEUS Prometheus event (xscript.txt #PROMETHEUS1)
# @TODO: Up for deprecation?
# preq_tech_starts_native_life_interlude = boolean; Starts interlude if preq_tech is known at turn 75.
# centauri_preserve_interlude = boolean; Starts a specific interlude. (depending on who built it)
# voice_of_planet_effects = boolean; Stuff


